name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Knowledge base + frontend — schema, integrity, graph, search, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm test cobre: kb-schema (JSON Schema de toda a base), kb-integrity (fontes, ids,
      # cross-refs), kb-graph (arestas, cadeias de falha, quality gates, órfãos), kb-search
      # (regressão da busca por sintoma), study-logic, mindmap, readiness, ATS e route-coverage.
      - name: install + test + build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  mcp:
    name: MCP server — build + stdio smoke (tools, new kinds, symptom search, related)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: install + build + smoke
        working-directory: mcp
        run: |
          npm ci
          npm run build
          npm run smoke
